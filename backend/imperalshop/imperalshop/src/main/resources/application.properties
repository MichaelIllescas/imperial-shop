spring.application.name=imperalshop
server.port=9090

# ========= MySQL DATABASE =========
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:imperialshop}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update


# ? LOGS (solo desarrollo)
logging.level.org.springframework.security=trace

# ========= ADMIN SEED (DEV) =========
app.seed.admin.enabled=true
app.seed.admin.email=admin@imperial.local
app.seed.admin.password=admin123
app.seed.admin.role=ADMIN
app.seed.admin.status=ACTIVE

jwt.secret=my-super-secret-key-my-super-secret-key-123456
jwt.expiration=86400000
